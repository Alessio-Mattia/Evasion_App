name: evasion
description: "Meet people in real life: proximity encounters, ephemeral geolocated posts and events."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.1.2
  image_cropper: ^13.0.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  riverpod_annotation: ^4.0.7
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.16.2
  freezed: ^4.0.3
  mocktail: ^1.0.5
  json_serializable: ^6.15.2

flutter:
  generate: true
  uses-material-design: true

  # Licences of the bundled fonts, shown on the app's licence page.
  assets:
    - assets/fonts/bricolage_grotesque/OFL.txt
    - assets/fonts/inter/OFL.txt

  # Static weights cut from the Google Fonts variable fonts (SIL Open Font
  # License): see lib/app/theme/app_fonts.dart.
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/bricolage_grotesque/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: assets/fonts/bricolage_grotesque/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/bricolage_grotesque/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
